<html>

<head>
    <title>Source Control</title>
    <script type="module">
        import { store } from "/plugins/_source_control/webui/source-control-store.js";
    </script>
</head>

<body>
    <div class="sc-panel" x-data x-init="$store.sourceControl.onMount()">
        <div class="sc-header">
            <div class="sc-header-title">
                <x-icon class="icon" name="commit"></x-icon>
                <span>Source Control</span>
            </div>
            <button type="button" class="button icon-button" title="Refresh"
                @click="$store.sourceControl.refresh()"
                :disabled="$store.sourceControl.loading">
                <x-icon class="icon" name="refresh"></x-icon>
            </button>
        </div>

        <template x-if="$store.sourceControl.loading && !$store.sourceControl.isGitRepo">
            <div class="sc-empty">Loading...</div>
        </template>

        <template x-if="!$store.sourceControl.loading && !$store.sourceControl.isGitRepo">
            <div class="sc-empty" x-text="$store.sourceControl.error || 'No active project, or the active project is not a git repository.'"></div>
        </template>

        <template x-if="$store.sourceControl.isGitRepo">
            <div class="sc-body">
                <div class="sc-branch">
                    <x-icon class="icon" name="alt_route"></x-icon>
                    <span x-text="$store.sourceControl.currentBranch || '(detached)'"></span>
                </div>

                <template x-if="!$store.sourceControl.hasChanges()">
                    <div class="sc-empty">No changes.</div>
                </template>

                <template x-if="$store.sourceControl.staged.length > 0">
                    <div class="sc-section">
                        <div class="sc-section-header">
                            <span>Staged Changes (<span x-text="$store.sourceControl.staged.length"></span>)</span>
                            <button type="button" class="button icon-button" title="Unstage all"
                                @click="$store.sourceControl.unstageAllStaged()">
                                <x-icon class="icon" name="remove"></x-icon>
                            </button>
                        </div>
                        <template x-for="entry in $store.sourceControl.staged" :key="'staged:' + entry.path">
                            <div class="sc-file-row"
                                :class="{ 'is-selected': $store.sourceControl.isSelected(entry.path, true, false) }"
                                @click="$store.sourceControl.selectFile({ path: entry.path, staged: true, untracked: false })">
                                <span class="sc-file-status" :data-status="entry.status" x-text="entry.status[0].toUpperCase()"></span>
                                <span class="sc-file-path" x-text="entry.path"></span>
                                <button type="button" class="button icon-button sc-file-action" title="Unstage"
                                    @click.stop="$store.sourceControl.unstage(entry.path)">
                                    <x-icon class="icon" name="remove"></x-icon>
                                </button>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="$store.sourceControl.unstaged.length > 0 || $store.sourceControl.untracked.length > 0">
                    <div class="sc-section">
                        <div class="sc-section-header">
                            <span>Changes (<span x-text="$store.sourceControl.unstaged.length + $store.sourceControl.untracked.length"></span>)</span>
                            <button type="button" class="button icon-button" title="Stage all"
                                @click="$store.sourceControl.stageAllUnstaged()">
                                <x-icon class="icon" name="add"></x-icon>
                            </button>
                        </div>
                        <template x-for="entry in $store.sourceControl.unstaged" :key="'unstaged:' + entry.path">
                            <div class="sc-file-row"
                                :class="{ 'is-selected': $store.sourceControl.isSelected(entry.path, false, false) }"
                                @click="$store.sourceControl.selectFile({ path: entry.path, staged: false, untracked: false })">
                                <span class="sc-file-status" :data-status="entry.status" x-text="entry.status[0].toUpperCase()"></span>
                                <span class="sc-file-path" x-text="entry.path"></span>
                                <button type="button" class="button icon-button sc-file-action" title="Stage"
                                    @click.stop="$store.sourceControl.stage(entry.path)">
                                    <x-icon class="icon" name="add"></x-icon>
                                </button>
                            </div>
                        </template>
                        <template x-for="path in $store.sourceControl.untracked" :key="'untracked:' + path">
                            <div class="sc-file-row"
                                :class="{ 'is-selected': $store.sourceControl.isSelected(path, false, true) }"
                                @click="$store.sourceControl.selectFile({ path: path, staged: false, untracked: true })">
                                <span class="sc-file-status" data-status="untracked">U</span>
                                <span class="sc-file-path" x-text="path"></span>
                                <button type="button" class="button icon-button sc-file-action" title="Stage"
                                    @click.stop="$store.sourceControl.stage(path)">
                                    <x-icon class="icon" name="add"></x-icon>
                                </button>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="$store.sourceControl.staged.length > 0">
                    <div class="sc-commit-box">
                        <textarea class="sc-commit-input" rows="3" placeholder="Commit message"
                            x-model="$store.sourceControl.commitMessage"
                            :disabled="$store.sourceControl.committing"></textarea>
                        <button type="button" class="button confirm sc-commit-button"
                            @click="$store.sourceControl.commit()"
                            :disabled="$store.sourceControl.committing || !$store.sourceControl.commitMessage.trim()">
                            <template x-if="$store.sourceControl.committing">
                                <span class="button-loading"><span class="spinner"></span><span>Committing...</span></span>
                            </template>
                            <template x-if="!$store.sourceControl.committing">
                                <span x-text="'Commit ' + $store.sourceControl.staged.length + ' file(s)'"></span>
                            </template>
                        </button>
                    </div>
                </template>

                <template x-if="$store.sourceControl.selected">
                    <div class="sc-diff">
                        <div class="sc-diff-header" x-text="$store.sourceControl.selected.path"></div>
                        <template x-if="$store.sourceControl.diffLoading">
                            <div class="sc-empty">Loading diff...</div>
                        </template>
                        <template x-if="!$store.sourceControl.diffLoading && !$store.sourceControl.diffText">
                            <div class="sc-empty">No diff to show.</div>
                        </template>
                        <template x-if="!$store.sourceControl.diffLoading && $store.sourceControl.diffText">
                            <pre class="sc-diff-content" x-text="$store.sourceControl.diffText"></pre>
                        </template>
                    </div>
                </template>
            </div>
        </template>
    </div>
</body>
<style>
    .sc-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
    }

    .sc-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75em 1em;
        border-bottom: 1px solid var(--color-border);
    }

    .sc-header-title {
        display: flex;
        align-items: center;
        gap: 0.5em;
        font-weight: 600;
    }

    .sc-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 0.5em 1em 1em;
    }

    .sc-branch {
        display: flex;
        align-items: center;
        gap: 0.4em;
        padding: 0.5em 0;
        color: var(--color-text-secondary, inherit);
        font-size: 0.9em;
    }

    .sc-empty {
        padding: 1em 0;
        color: var(--color-text-secondary, inherit);
        font-size: 0.9em;
    }

    .sc-section {
        margin-bottom: 0.75em;
    }

    .sc-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 600;
        font-size: 0.85em;
        padding: 0.4em 0;
        text-transform: uppercase;
        letter-spacing: 0.02em;
    }

    .sc-file-row {
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.3em 0.4em;
        border-radius: 0.3em;
        cursor: pointer;
    }

    .sc-file-row:hover {
        background: var(--color-panel-hover, rgba(128, 128, 128, 0.1));
    }

    .sc-file-row.is-selected {
        background: var(--color-panel-selected, rgba(128, 128, 128, 0.2));
    }

    .sc-file-status {
        flex: 0 0 auto;
        width: 1.4em;
        text-align: center;
        font-weight: 700;
        font-size: 0.8em;
        opacity: 0.75;
    }

    .sc-file-status[data-status="added"],
    .sc-file-status[data-status="untracked"] {
        color: #3fb950;
    }

    .sc-file-status[data-status="deleted"] {
        color: #f85149;
    }

    .sc-file-status[data-status="renamed"] {
        color: #d29922;
    }

    .sc-file-path {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.9em;
    }

    .sc-file-action {
        flex: 0 0 auto;
        opacity: 0;
    }

    .sc-file-row:hover .sc-file-action {
        opacity: 1;
    }

    .sc-commit-box {
        display: flex;
        flex-direction: column;
        gap: 0.5em;
        margin: 0.75em 0;
    }

    .sc-commit-input {
        width: 100%;
        resize: vertical;
        font-family: inherit;
        padding: 0.5em;
        border-radius: 0.3em;
        border: 1px solid var(--color-border);
        background: var(--color-input-bg, transparent);
        color: inherit;
    }

    .sc-diff {
        margin-top: 0.75em;
        border-top: 1px solid var(--color-border);
        padding-top: 0.5em;
    }

    .sc-diff-header {
        font-weight: 600;
        font-size: 0.85em;
        margin-bottom: 0.4em;
        overflow-wrap: break-word;
    }

    .sc-diff-content {
        white-space: pre-wrap;
        overflow-wrap: break-word;
        font-family: var(--font-mono, monospace);
        font-size: 0.85em;
        background: var(--color-panel, rgba(128, 128, 128, 0.05));
        border-radius: 0.3em;
        padding: 0.5em;
        max-height: 40vh;
        overflow-y: auto;
    }

    .button-loading {
        display: inline-flex;
        align-items: center;
        gap: 0.5em;
    }

    .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top: 2px solid white;
        border-radius: 50%;
        animation: sc-spin 1s linear infinite;
    }

    @keyframes sc-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>

</html>
